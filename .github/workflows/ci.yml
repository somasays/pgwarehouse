name: CI

on:
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install poetry
        poetry install
        poetry add --group dev pytest-cov
        
    - name: Run tests
      run: |
        # Skip tests requiring external dependencies
        poetry run python -m pytest pgwarehouse/tests/test_backend.py \
               pgwarehouse/tests/test_duckdb_backend.py \
               pgwarehouse/tests/test_command_injection.py \
               pgwarehouse/tests/test_security.py \
               pgwarehouse/tests/test_log_security.py \
               -k "not clickhouse and not snowflake and not postgres" \
               --cov=pgwarehouse
        
    - name: Generate coverage report
      run: |
        poetry run python -m pytest pgwarehouse/tests/test_backend.py \
               pgwarehouse/tests/test_duckdb_backend.py \
               pgwarehouse/tests/test_command_injection.py \
               pgwarehouse/tests/test_security.py \
               pgwarehouse/tests/test_log_security.py \
               -k "not clickhouse and not snowflake and not postgres" \
               --cov=pgwarehouse --cov-report=xml
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false